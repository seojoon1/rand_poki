<!-- 공유 미리보기 카드 원본(1200×630). 색상은 app.css 의 accent 토큰과 동일.
     크롤러(카카오톡·네이버·트위터)는 SVG 를 대부분 지원하지 않으므로
     이 파일을 PNG 로 변환해 public/og.png 로 저장해야 실제로 노출된다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4372" />
      <stop offset="55%" stop-color="#2176d2" />
      <stop offset="100%" stop-color="#3391ec" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- 장식용 몬스터볼 실루엣 -->
  <g opacity="0.16" transform="translate(950 315)">
    <circle r="230" fill="#ffffff" />
    <rect x="-230" y="-16" width="460" height="32" fill="#142a4a" />
    <circle r="66" fill="#142a4a" />
    <circle r="42" fill="#ffffff" />
  </g>

  <g fill="#ffffff" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif">
    <text x="90" y="250" font-size="86" font-weight="800">랜덤 포켓몬 뽑기</text>
    <text x="90" y="330" font-size="40" font-weight="500" opacity="0.92">
      세대 · 타입 · 진화 단계 · 종족값으로 조건 뽑기
    </text>
    <text x="90" y="392" font-size="40" font-weight="500" opacity="0.92">
      개체값 · 성격 · 특성까지 돌려 스타팅 결정
    </text>
  </g>

  <!-- 능력치 막대 모티프 -->
  <g transform="translate(90 470)">
    <rect width="420" height="18" rx="9" fill="#ffffff" opacity="0.25" />
    <rect width="330" height="18" rx="9" fill="#ffffff" opacity="0.85" />
    <rect y="42" width="420" height="18" rx="9" fill="#ffffff" opacity="0.25" />
    <rect y="42" width="210" height="18" rx="9" fill="#ffffff" opacity="0.85" />
    <rect y="84" width="420" height="18" rx="9" fill="#ffffff" opacity="0.25" />
    <rect y="84" width="395" height="18" rx="9" fill="#ffffff" opacity="0.85" />
  </g>
</svg>
